[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/inertialabsxyz/fornace"

[workspace.dependencies]
fornace-engine = { path = "crates/fornace-engine", version = "0.0.1" }
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.23.2"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
textplots = "0.8.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
tracing-chrome = "0.7.2"
memory-stats = "1.2.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = "0.8.9"
tokio-stream = "0.1.19"
futures-util = "0.3.34"
ureq = "3.5.2"
# The grammar engine of the constrained sampling mask (fornace-constrain).
llguidance = { version = "1.9.1", default-features = false, features = ["lark"] }

# Candle 0.11.0 with five changes (fork branch fornace/qmatmul-tile):
# - The Metal buffer pool does not reuse a buffer larger than 2 × the rounded
#   request. Without it, a long prefill with the cat-contiguous KV cache holds
#   one score buffer for each layer (upstream PR 3851).
# - `KvCache::truncate`, the rollback of speculative decoding.
# - The causal mask of the Metal `sdpa` full kernel with fewer queries than
#   keys (upstream PR 4062). Without it, a verify pass can see later keys.
# - One mat-vec launch for 2 to 8 rows of a quantized matmul (upstream PR
#   3898), not one launch for each row.
# - A tile kernel for the Q4_0 and Q8_0 matmul with 4 to 16 rows, which reads
#   each weight block once for up to 8 rows (a decode step of a batch).
# Remove this patch when upstream Candle has all five.
[patch.crates-io]
candle-core = { git = "https://github.com/inertialabsxyz/candle", rev = "e8540dbb51bdbc3e25e47d21aba5977eaf4cb864" }
candle-nn = { git = "https://github.com/inertialabsxyz/candle", rev = "e8540dbb51bdbc3e25e47d21aba5977eaf4cb864" }
candle-metal-kernels = { git = "https://github.com/inertialabsxyz/candle", rev = "e8540dbb51bdbc3e25e47d21aba5977eaf4cb864" }
